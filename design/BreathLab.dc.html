<script type="text/x-dc" data-dc-script data-props='{"micThreshold":{"editor":"range","default":8,"min":3,"max":20,"step":0.5,"unit":"dB"},"calBreaths":{"editor":"range","default":4,"min":2,"max":10,"step":1,"unit":"exhales"},"bodyColor":{"editor":"color","default":"#8FD3E8","options":["#8FD3E8","#B9A7F0","#F2A7C3","#9FE3B5"]},"$preview":{"width":390,"height":844}}'>

  }
  micDecide(ev) {

    if (m.mode === 'both') { ev.cue = this.micCueAt(ev.t0); label = this.micClassify(ev.f, ev.cue); }
    else if (m.mode === 'exhale') {

      var P = m.prof.ex;
      var stray = ev.f[0] < P.mu[0] - 3 * P.sd[0] || ev.f[1] > P.mu[1] + 3 * P.sd[1];

      else if ((ev.cue = this.micCueAt(ev.t0))) label = ev.cue;                              // the cue on screen labels it

    el.cueOutRef.style.opacity = cueOn ? win(0.4, 0.65).toFixed(2) : '0';
    el.cueRestRef.style.opacity = cueOn ? win(0.65, 0.97).toFixed(2) : '0';
    var startTxt = !m ? (this.micErr || 'Turn on the mic to begin') : s.phase === 'start' ? 'Breathe in' : (!cueOn ? 'Breathe at your own pace' : '');
    el.cueStartRef.style.opacity = startTxt ? '1' : '0';
    if (startTxt && el.cueStartRef.textContent !== startTxt) el.cueStartRef.textContent = startTxt;
    var sw = g < 0.4 ? 0.12 + 0.88 * (1 - Math.cos(Math.PI * g / 0.4)) / 2 : g < 0.65 ? 1 - 0.88 * (1 - Math.cos(Math.PI * (g - 0.4) / 0.25)) / 2 : 0.12;
    el.swellRef.style.transform = 'scaleX(' + (cueOn ? sw : 0.12).toFixed(3) + ')';
    el.swellRef.parentNode.style.opacity = cueOn ? '1' : '0.3';

    // ---------- instruments ----------
    var onT = this.micOnThreshold();
    var cueLab = cueOn ? (g >= 0.97 || g < 0.4 ? 'in' : g < 0.65 ? 'ex' : 'glide') : null;
    if (m && m.warm >= 1) {
      s.trace.push({ t: t, rel: m.rel, thr: onT, cue: cueLab });
      while (s.trace.length && s.trace[0].t < t - 32) s.trace.shift();
    }
    el.lvlRef.style.transform = 'scaleX(' + (m ? Math.max(0, Math.min(1, m.rel / 50)) : 0).toFixed(3) + ')';
    el.lvlRef.style.background = hearing === 'in' ? '#B9A7F0' : hearing === 'ex' ? '#8FD3E8' : '#E8F1F2';
    el.thrRef.style.left = (Math.min(1, onT / 50) * 100).toFixed(1) + '%';
    var lt = m ? m.rel.toFixed(1) + ' dB' : '-- dB';
    if (el.lvlTxtRef.textContent !== lt) el.lvlTxtRef.textContent = lt;
    var stt = this.labStatus();
    if (el.statusRef.textContent !== stt) el.statusRef.textContent = stt;
    s.drawAcc = (s.drawAcc || 0) + dt;
    if (s.drawAcc >= 1 / 30) { s.drawAcc = 0; this.drawTimeline(t); this.drawFeatures(); this.drawTable(); }
  }
  labStatus() {
    var m = this.mic; if (!m) return this.micErr || 'Microphone off';
    var lag = Math.round(m.lag * 1000) + ' ms lag' + (m.inLat == null ? ' (est.)' : '');
    if (m.warm == null || m.warm < 1) return 'Listening to the room…';
    var calN = this.props.calBreaths ?? 4;
    if (m.mode === 'calibrating') {
      var ne = m.events.filter(function (x) { return x.label === 'ex'; }).length, ni = m.events.filter(function (x) { return x.label === 'in'; }).length;
      return 'Calibrating · breathe with the cue · exhales ' + ne + ' / ' + calN + ' · inhales ' + ni + '\n' + lag;
    }
    if (m.mode === 'both') {
      var Pe = m.prof.ex, Pi = m.prof.in;
      return 'Inhales + exhales' + (m.byCue ? ' (labelled by cue: they sound alike)' : '') + ' · ' + lag +
        '\nex ' + Pe.mu[0].toFixed(1) + ' dB · ' + Math.round(Math.pow(2, Pe.mu[1])) + ' Hz   in ' + Pi.mu[0].toFixed(1) + ' dB · ' + Math.round(Math.pow(2, Pi.mu[1])) + ' Hz';
    }
    var nx = m.events.filter(function (x) { return x.label === 'x'; }).length;
    return 'Exhales only' + (m.guard != null ? ' · guard ' + m.guard.toFixed(1) + ' dB' : '') + (nx ? ' · ' + nx + ' ignored' : '') + (m.warn ? ' (' + m.warn + ')' : '') + ' · ' + lag +
      '\nex ' + m.prof.ex.mu[0].toFixed(1) + ' dB · ' + Math.round(Math.pow(2, m.prof.ex.mu[1])) + ' Hz · inhales between exhales ' + Math.round((m.alt || 0) * 100) + '%';
  }
  // last 30 s: the level above the room's floor, the threshold, each detected sound as a band coloured by its label
  // (thin top edge = the live label, if it changed), and the cue that was on screen along the bottom
  drawTimeline(t) {
    var cv = this._els.tlRef; if (!cv) return;
    var cx = cv.getContext('2d'), W = cv.width, H = cv.height, k = 2, span = 30, s = this.sim, m = this.mic;
    cx.clearRect(0, 0, W, H);
    var top = 8 * k, bot = H - 16 * k, cueY = H - 10 * k;
    function X(tt) { return W * (1 - (t - tt) / span); }
    function Y(db) { return bot - (bot - top) * Math.max(0, Math.min(1, db / 50)); }
    var COL = { in: '#B9A7F0', ex: '#8FD3E8', x: '#6B7C88', glide: '#3A4B57' };
    // seconds grid
    cx.strokeStyle = 'rgba(232,241,242,0.06)'; cx.lineWidth = 1;
    for (var sg = Math.ceil(t - span); sg <= t; sg++) if (sg % 5 === 0) { cx.beginPath(); cx.moveTo(X(sg), top); cx.lineTo(X(sg), bot); cx.stroke(); }
    // cue strip
    var tr = s.trace;
    for (var i = 1; i < tr.length; i++) {
      if (!tr[i].cue) continue;
      cx.fillStyle = tr[i].cue === 'in' ? 'rgba(185,167,240,0.55)' : tr[i].cue === 'ex' ? 'rgba(143,211,232,0.55)' : 'rgba(58,75,87,0.6)';
      cx.fillRect(X(tr[i - 1].t), cueY, X(tr[i].t) - X(tr[i - 1].t) + 0.5, 7 * k);
    }
    // detected sounds
    if (m) m.log.forEach(function (r) {
      var x0 = X(r.t0), x1 = X(r.t0 + r.dur); if (x1 < 0) return;
      cx.fillStyle = COL[r.label] || '#E8F1F2';
      cx.globalAlpha = r.cont ? 0.12 : r.short ? 0.1 : 0.22; cx.fillRect(x0, top, x1 - x0, bot - top);
      cx.globalAlpha = 1; cx.fillRect(x0, top, Math.max(2, x1 - x0), 3 * k);
      if (r.live && r.live !== r.label) { cx.fillStyle = COL[r.live]; cx.fillRect(x0, top + 3 * k, Math.max(2, x1 - x0), 2 * k); }
      cx.fillStyle = '#E8F1F2'; cx.font = (9 * k) + 'px IBM Plex Mono, monospace';
      if (!r.cont && x1 - x0 > 14 * k) cx.fillText(r.label === 'in' ? 'in' : r.label === 'ex' ? 'ex' : r.label, x0 + 3 * k, top + 13 * k);
    });
    if (m && m.ev) { var xe = X(m.ev.t0); cx.fillStyle = 'rgba(232,241,242,0.12)'; cx.fillRect(xe, top, W - xe, bot - top); }
    // threshold and level
    cx.strokeStyle = '#F4A259'; cx.lineWidth = 1.5 * k / 2; cx.beginPath();
    tr.forEach(function (p2, j) { var xx = X(p2.t), yy = Y(p2.thr); if (j) cx.lineTo(xx, yy); else cx.moveTo(xx, yy); }); cx.stroke();
    cx.strokeStyle = '#E8F1F2'; cx.lineWidth = 1.2 * k; cx.beginPath();
    tr.forEach(function (p2, j) { var xx = X(p2.t), yy = Y(p2.rel); if (j) cx.lineTo(xx, yy); else cx.moveTo(xx, yy); }); cx.stroke();
    cx.fillStyle = '#6B7C88'; cx.font = (9 * k) + 'px IBM Plex Mono, monospace';
    cx.fillText('50 dB', 4 * k, top + 8 * k); cx.fillText('-30 s', 4 * k, bot - 3 * k); cx.fillText('now', W - 22 * k, bot - 3 * k);
  }
  // every sound by its two features: level (dB above the room) across, brightness (spectral centroid) up
  drawFeatures() {
    var cv = this._els.fpRef; if (!cv) return;
    var cx = cv.getContext('2d'), W = cv.width, H = cv.height, k = 2, m = this.mic;
    cx.clearRect(0, 0, W, H);
    var L = 16 * k, R = W - 6 * k, Tp = 6 * k, B = H - 16 * k;
    function X(db) { return L + (R - L) * Math.max(0, Math.min(1, db / 50)); }
    function Y(l2) { return B - (B - Tp) * Math.max(0, Math.min(1, (l2 - 7) / 5)); }   // 128 Hz .. 4 kHz
    cx.strokeStyle = 'rgba(232,241,242,0.15)'; cx.lineWidth = 1; cx.strokeRect(L, Tp, R - L, B - Tp);
    cx.fillStyle = '#6B7C88'; cx.font = (8 * k) + 'px IBM Plex Mono, monospace';
    cx.fillText('level →', L + 2 * k, H - 4 * k); cx.save(); cx.translate(10 * k, B - 2 * k); cx.rotate(-Math.PI / 2); cx.fillText('bright →', 0, 0); cx.restore();
    if (!m) return;
    var COL = { in: '#B9A7F0', ex: '#8FD3E8', x: '#6B7C88' };
    if (m.prof) Object.keys(m.prof).forEach(function (kk) {
      var Pp = m.prof[kk]; cx.strokeStyle = COL[kk]; cx.globalAlpha = 0.6; cx.lineWidth = 1.5;
      cx.beginPath(); cx.ellipse(X(Pp.mu[0]), Y(Pp.mu[1]), Math.abs(X(Pp.mu[0] + Pp.sd[0]) - X(Pp.mu[0])), Math.abs(Y(Pp.mu[1] + Pp.sd[1]) - Y(Pp.mu[1])), 0, 0, 2 * Math.PI); cx.stroke();
      cx.globalAlpha = 1;
    });
    m.log.forEach(function (r) {
      if (!r.f || r.cont) return;
      var x = X(r.f[0]), y = Y(r.f[1]);
      cx.fillStyle = COL[r.label] || '#E8F1F2'; cx.globalAlpha = r.short ? 0.35 : 0.9;
      cx.beginPath(); cx.arc(x, y, 3.2 * k, 0, 2 * Math.PI); cx.fill(); cx.globalAlpha = 1;
      if (r.cue) { cx.strokeStyle = r.cue === 'in' ? '#B9A7F0' : '#8FD3E8'; cx.lineWidth = 1.2 * k; cx.beginPath(); cx.arc(x, y, 5.6 * k, 0, 2 * Math.PI); cx.stroke(); }
    });
  }
  // recent sounds, newest first: when, how long, level, brightness, the cue it began under, the live label and the
  // label it holds now (calibration's re-sort can change it)
  drawTable() {
    var el = this._els.tableRef; if (!el) return;
    var m = this.mic, s = this.sim;
    if (!m || !m.log.length) { if (el.textContent !== 'No sounds yet') el.textContent = 'No sounds yet'; return; }
    var t0 = s.t0 || m.log[0].t0;
    var rows = ['   t   dur  lvl   Hz  cue  label'];
    m.log.slice(-9).reverse().forEach(function (r) {
      var lab = r.cont ? '+ cont' : r.live && r.live !== r.label ? r.live + '→' + r.label : r.label;
      if (r.short && !r.cont) lab += ' (short)';
      var hz = r.f ? Math.round(Math.pow(2, r.f[1])) : 0;
      rows.push(((r.t0 - t0).toFixed(1)).padStart(5) + ' ' + r.dur.toFixed(1).padStart(4) + ' ' + (r.f ? r.f[0].toFixed(0) : '-').padStart(4) + ' ' + String(hz).padStart(4) + '  ' + (r.core ? r.core.toUpperCase() : r.cue || ' - ').padEnd(3) + '  ' + lab);
    });
    var txt = rows.join('\n');
    if (el.textContent !== txt) el.textContent = txt;
  }

  renderVals() {
    this.init();
    var self = this, st = this.state || {};
    var bodyColor = this.props.bodyColor ?? '#8FD3E8';
    var vals = {};
    ['swayRef', 'bodyRef', 'haloRef', 'tentRef', 'bellRef', 'innerRef', 'glossRef', 'cueInRef', 'cueOutRef', 'cueRestRef', 'cueStartRef', 'swellRef',
      'statusRef', 'lvlRef', 'thrRef', 'lvlTxtRef', 'tlRef', 'fpRef', 'tableRef'].forEach(function (nm) { vals[nm] = self.ref(nm); });
    return Object.assign(vals, {
      bodyColor: bodyColor,
      bpm: this.cueBpm(),
      bpmLabel: this.cueBpm() + ' / min',
      onBpm: function (ev) { self.setState({ bpm: Number(ev.target.value) }); },
      keepCues: st.keepCues !== false,
      onKeepCues: function (ev) { self.setState({ keepCues: ev.target.checked }); },
      micLabel: st.mic ? 'Stop mic' : 'Start mic',
      micBtnRing: st.mic ? bodyColor : 'rgba(232,241,242,0.25)',
      micBtnFill: st.mic ? 'rgba(143,211,232,0.18)' : 'transparent',
      onMicToggle: function () { self.setMic(!st.mic); },
      onRecalibrate: function () { self.recalibrate(); }
    });
  }
}
</script>
</body>
</html>
