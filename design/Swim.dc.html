          var wf = wk / K;
          var sway = (6 + wd.h * 0.025) * Math.sin(t * wd.sp + wd.ph + wf * 2.4) * Math.pow(wf, 1.3);
          var dxj = wd.x - s.jx;
          sway += s.rustle * 30 * Math.exp(-Math.abs(dxj) / 70) * wf * (dxj >= 0 ? 1 : -1);   // parts around the jellyfish as it pushes off
          var wx = wd.x + sway, wy = floorY + 6 - wd.h * wf;
          var ww = wd.w * (1 - (wd.row === 'F' ? 0.55 : 0.8) * Math.pow(wf, 1.6)) * (0.85 + 0.15 * Math.sin(wf * 9 + wd.ph)) / 2;
          left += (wk === 0 ? 'M ' : ' L ') + (wx - ww).toFixed(1) + ' ' + wy.toFixed(1);
          right = ' L ' + (wx + ww).toFixed(1) + ' ' + wy.toFixed(1) + right;
        }
        weedOut[wd.row + wd.col] += left + right + ' Z ';
      }
    }
    ['B0', 'B1', 'F0', 'F1', 'F2'].forEach(function (k) { var we = el['weed' + k + 'Ref']; if (we) we.setAttribute('d', weedOut[k] || 'M 0 0'); });

    // the surface: water above it is clipped away, the sky shows through, a wave line marks it
    var surfaceY = 325 - (S - s.dist);
    if (el.wclipRef) el.wclipRef.setAttribute('y', Math.max(-4000, surfaceY).toFixed(1));
    var skyOn = surfaceY > -20;
    if (el.skyRef) { el.skyRef.style.display = skyOn ? '' : 'none'; if (skyOn) el.skyRef.setAttribute('transform', 'translate(0 ' + surfaceY.toFixed(1) + ')'); }
    if (el.surfaceRef) {
      if (surfaceY > -20 && surfaceY < 900) {
        var sd = '';
        for (var sx = -10; sx <= 400; sx += 10) sd += (sx === -10 ? 'M ' : ' L ') + sx + ' ' + (surfaceY + 2.5 * Math.sin(sx * 0.035 + t * 1.6) + 1.5 * Math.sin(sx * 0.08 - t * 2.3)).toFixed(1);
        el.surfaceRef.setAttribute('d', sd);
      } else el.surfaceRef.setAttribute('d', 'M 0 0');
    }
    if (el.veilRef) { el.veilRef.setAttribute('y', Math.max(-4000, surfaceY).toFixed(1)); el.veilRef.style.opacity = surfaceY > -20 ? '0.22' : '0'; }

    // guide (driven only by the slider): in 0-40%, out 40-65%, glide 65-100%
    var g = s.guide;
    function win(a0, a1) { var fade = 0.04; return Math.max(0, Math.min(1, Math.min((g - a0) / fade + 1, (a1 - g) / fade + 1))); }
    if (el.cueInRef) el.cueInRef.style.opacity = Math.max(win(0, 0.4), g > 0.97 ? 1 : 0).toFixed(2);
    if (el.cueOutRef) el.cueOutRef.style.opacity = win(0.4, 0.65).toFixed(2);
    if (el.cueRestRef) el.cueRestRef.style.opacity = win(0.65, 0.97).toFixed(2);
    // start: only the invitation to rise; end: the arrival line. The breathing cues step aside for both.
    var atStart = s.phase === 'start', atEnd = s.phase === 'float' || s.phase === 'breach';
    if (atStart || atEnd) { el.cueInRef.style.opacity = '0'; el.cueOutRef.style.opacity = '0'; el.cueRestRef.style.opacity = '0'; }
    if (el.cueStartRef) el.cueStartRef.style.opacity = atStart ? '1' : '0';
    if (el.cueEndRef) el.cueEndRef.style.opacity = s.phase === 'float' ? '1' : '0';
    if (el.guideCueRef && (atStart || atEnd)) el.guideCueRef.style.opacity = '1';
    var sw;
    if (g < 0.4) sw = 0.12 + 0.88 * (1 - Math.cos(Math.PI * g / 0.4)) / 2;
    else if (g < 0.65) sw = 1 - 0.88 * (1 - Math.cos(Math.PI * (g - 0.4) / 0.25)) / 2;
    else sw = 0.12;
    if (el.swellRef) el.swellRef.style.transform = 'scaleX(' + sw.toFixed(3) + ')';
  }

  // ---------- template values ----------
  renderVals() {
    this.init();
    var self = this, st = this.state || {};
    var bpm = this.guide1Bpm();
    var bodyColor = this.props.bodyColor ?? '#8FD3E8';
    var names = ['farFieldRef', 'nearFieldRef', 'far0_0Ref', 'far0_1Ref', 'far0_2Ref', 'far0_3Ref', 'far0_4Ref', 'far1_0Ref', 'far1_1Ref', 'far1_2Ref', 'far1_3Ref', 'far1_4Ref', 'near0_0Ref', 'near0_1Ref', 'near0_2Ref', 'near0_3Ref', 'near0_4Ref', 'near1_0Ref', 'near1_1Ref', 'near1_2Ref', 'near1_3Ref', 'near1_4Ref', 'near2_0Ref', 'near2_1Ref', 'near2_2Ref', 'near2_3Ref', 'near2_4Ref', 'swayRef', 'bodyRef', 'haloRef', 'tentRef', 'bellRef', 'innerRef', 'glossRef', 'cueInRef', 'cueOutRef', 'cueRestRef', 'swellRef', 'syncRef', 'glowRef', 'dimRef', 'guideCueRef', 'depthRef', 'wclipRef', 'skyRef', 'floorRef', 'weedB0Ref', 'weedB1Ref', 'weedF0Ref', 'weedF1Ref', 'weedF2Ref', 'veilRef', 'surfaceRef', 'cueStartRef', 'cueEndRef', 'pStop0Ref', 'pStop1Ref', 'gStop0Ref', 'gStop1Ref', 'gSwayRef', 'gBodyRef', 'gHaloRef', 'gTentRef', 'gBellRef', 'gInnerRef', 'gGlossRef', 'fishL0LayerRef', 'fishL0_0Ref', 'tailL0_0Ref', 'fishL0_1Ref', 'tailL0_1Ref', 'fishL0_2Ref', 'tailL0_2Ref', 'fishL1LayerRef', 'fishL1_0Ref', 'tailL1_0Ref', 'fishL1_1Ref', 'tailL1_1Ref', 'fishL1_2Ref', 'tailL1_2Ref', 'fishL2LayerRef', 'fishL2_0Ref', 'tailL2_0Ref', 'fishL2_1Ref', 'tailL2_1Ref', 'fishL3LayerRef', 'fishL3_0Ref', 'tailL3_0Ref', 'fishL4LayerRef', 'fishL4_0Ref', 'tailL4_0Ref'];
    var vals = {};
    names.forEach(function (nm) { vals[nm] = self.ref(nm); });
    return Object.assign(vals, {
      bodyColor: bodyColor,
      bpm: bpm,
      guideLabel: bpm + ' breaths / min',
      onGuide: function (ev) { self.setState({ bpm: Number(ev.target.value) }); },
      bpm2: this.guide2Bpm(),
      guide2Label: this.guide2Bpm() + ' breaths / min',
      onGuide2: function (ev) { self.setState({ bpm2: Number(ev.target.value) }); },
      fishBgOn: st.fishBg !== false,
      fishFgOn: st.fishFg !== false,
      onFishBg: function (ev) { self.setState({ fishBg: ev.target.checked }); },
      onFishFg: function (ev) { self.setState({ fishFg: ev.target.checked }); },
      soundOn: !!st.sound,
      onSound: function (ev) { self.setSound(ev.target.checked); },
      onRestart: function () { self.restart(); },
      onBreathStart: function (ev) { if (ev && ev.preventDefault) ev.preventDefault(); self.breathStart(); },
      onBreathEnd: function () { self.breathEnd(); },
      onKeyStart: function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); if (!ev.repeat) self.breathStart(); } },
      onKeyEnd: function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); self.breathEnd(); } },
      buttonText: st.pressed ? 'Exhaling' : 'Hold to exhale',
      buttonFill: st.pressed ? 'rgba(143,211,232,0.32)' : 'rgba(232,241,242,0.06)',
      buttonRing: st.pressed ? bodyColor : 'rgba(232,241,242,0.3)',
      readout1: st.readout1 || 'Hold the button while you breathe out',
      readout2: st.readout2 || 'Breathe out with the cue to build sync'
    });
  }
}
</script>
