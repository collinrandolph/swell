<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swell prototype</title>
<meta name="theme-color" content="#06101B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#02060B;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#phone{width:390px;height:844px;flex:none;transform-origin:center center;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px rgba(232,241,242,0.08),0 30px 80px rgba(0,0,0,0.6)}
a{color:#9FD3E8}a:hover{color:#CFEAF3}
</style>
</head>
<body>
<div id="stage"><div id="phone"></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #06101B; font-family: 'IBM Plex Mono', ui-monospace, monospace">
<svg viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px" aria-hidden="true">
<defs>
<linearGradient id="sw-water" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" style="stop-color: #163E5A"></stop>
<stop offset="0.55" style="stop-color: #0A1F31"></stop>
<stop offset="1" style="stop-color: #040A13"></stop>
</linearGradient>
<linearGradient id="sw-bellfill" x1="0" y1="0" x2="0" y2="1">
<stop ref="{{pStop0Ref}}" offset="0" style="stop-color: {{bodyColor}}; stop-opacity: 0.95"></stop>
<stop ref="{{pStop1Ref}}" offset="1" style="stop-color: {{bodyColor}}; stop-opacity: 0.4"></stop>
</linearGradient>
<linearGradient id="sw-hbellfill" x1="0" y1="0" x2="0" y2="1">
<stop ref="{{hStop0Ref}}" offset="0" style="stop-color: #C9A7F0; stop-opacity: 0.95"></stop>
<stop ref="{{hStop1Ref}}" offset="1" style="stop-color: #C9A7F0; stop-opacity: 0.4"></stop>
</linearGradient>
<linearGradient id="sw-gbellfill" x1="0" y1="0" x2="0" y2="1">
<stop ref="{{gStop0Ref}}" offset="0" style="stop-color: #B9A7F0; stop-opacity: 0.95"></stop>
<stop ref="{{gStop1Ref}}" offset="1" style="stop-color: #B9A7F0; stop-opacity: 0.4"></stop>
</linearGradient>
<radialGradient id="sw-glow" cx="0.5" cy="0.45" r="0.75">
<stop offset="0" style="stop-color: #3FE0C8; stop-opacity: 0.55"></stop>
<stop offset="0.5" style="stop-color: #1F8FA8; stop-opacity: 0.22"></stop>
<stop offset="1" style="stop-color: #06101B; stop-opacity: 0"></stop>
</radialGradient>
<filter id="sw-dof1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.35"></feGaussianBlur></filter>
<filter id="sw-dof2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.6"></feGaussianBlur></filter>
<filter id="sw-halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter>
<linearGradient id="sw-sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" style="stop-color: #2F7FD8"></stop>
<stop offset="0.7" style="stop-color: #7FC2F0"></stop>
<stop offset="1" style="stop-color: #BFE6FA"></stop>
</linearGradient>
<filter id="sw-cloud" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
<filter id="sw-sun" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"></feGaussianBlur></filter>
<clipPath id="sw-wclip"><rect ref="{{wclipRef}}" x="-60" y="-4000" width="510" height="9000"></rect></clipPath>
</defs>
<g ref="{{skyRef}}" style="display: none">
<rect x="-10" y="-900" width="410" height="900" style="fill: url(#sw-sky)"></rect>
<circle cx="292" cy="-300" r="70" filter="url(#sw-sun)" style="fill: #FFF3C4; opacity: 0.55"></circle>
<circle cx="292" cy="-300" r="26" style="fill: #FFF8E1"></circle>
<g filter="url(#sw-cloud)" style="fill: #FFFFFF; opacity: 0.85">
<ellipse cx="80" cy="-420" rx="58" ry="16"></ellipse><ellipse cx="112" cy="-432" rx="36" ry="18"></ellipse>
<ellipse cx="250" cy="-170" rx="70" ry="14"></ellipse><ellipse cx="220" cy="-180" rx="34" ry="15"></ellipse>
<ellipse cx="350" cy="-520" rx="48" ry="12"></ellipse>
</g>
<rect x="-10" y="-36" width="410" height="36" style="fill: #FFFFFF; opacity: 0.18"></rect>
</g>
<g clip-path="url(#sw-wclip)">
<rect x="0" y="0" width="390" height="844" style="fill: url(#sw-water)"></rect>
<rect ref="{{glowRef}}" x="0" y="0" width="390" height="844" style="fill: url(#sw-glow); opacity: 0"></rect>
<rect ref="{{dimRef}}" x="0" y="0" width="390" height="844" style="fill: #01050A; opacity: 0"></rect>
<g ref="{{farFieldRef}}">
<path ref="{{far0_0Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.25; stroke-width: 1.6; stroke-linecap: round"></path>
<path ref="{{far0_1Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.25; stroke-width: 1.6; stroke-linecap: round"></path>
<path ref="{{far0_2Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.25; stroke-width: 1.6; stroke-linecap: round"></path>
<path ref="{{far0_3Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.25; stroke-width: 1.6; stroke-linecap: round"></path>
<path ref="{{far0_4Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.25; stroke-width: 1.6; stroke-linecap: round"></path>
<path ref="{{far1_0Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.35; stroke-width: 2.2; stroke-linecap: round"></path>
<path ref="{{far1_1Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.35; stroke-width: 2.2; stroke-linecap: round"></path>
<path ref="{{far1_2Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.35; stroke-width: 2.2; stroke-linecap: round"></path>
<path ref="{{far1_3Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.35; stroke-width: 2.2; stroke-linecap: round"></path>
<path ref="{{far1_4Ref}}" d="M 0 0" style="fill: none; stroke: #9FB3BF; stroke-opacity: 0.35; stroke-width: 2.2; stroke-linecap: round"></path>
</g>
<g ref="{{fishL0LayerRef}}">
<g ref="{{fishL0_0Ref}}" style="display: none; fill: #4C7E98"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL0_0Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
<g ref="{{fishL0_1Ref}}" style="display: none; fill: #4C7E98"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL0_1Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
<g ref="{{fishL0_2Ref}}" style="display: none; fill: #4C7E98"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL0_2Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
</g>
<g ref="{{fishL1LayerRef}}">
<g ref="{{fishL1_0Ref}}" style="display: none; fill: #2E5A72"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL1_0Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
<g ref="{{fishL1_1Ref}}" style="display: none; fill: #2E5A72"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL1_1Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
<g ref="{{fishL1_2Ref}}" style="display: none; fill: #2E5A72"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL1_2Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
</g>
<g ref="{{fishL2LayerRef}}">
<g ref="{{fishL2_0Ref}}" style="display: none; fill: #173448"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL2_0Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
<g ref="{{fishL2_1Ref}}" style="display: none; fill: #173448"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL2_1Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
</g>
<g ref="{{nearFieldRef}}">
<path ref="{{near0_0Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.28; stroke-width: 2.8; stroke-linecap: round"></path>
<path ref="{{near0_1Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.28; stroke-width: 2.8; stroke-linecap: round"></path>
<path ref="{{near0_2Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.28; stroke-width: 2.8; stroke-linecap: round"></path>
<path ref="{{near0_3Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.28; stroke-width: 2.8; stroke-linecap: round"></path>
<path ref="{{near0_4Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.28; stroke-width: 2.8; stroke-linecap: round"></path>
<path ref="{{near1_0Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.36; stroke-width: 4; stroke-linecap: round"></path>
<path ref="{{near1_1Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.36; stroke-width: 4; stroke-linecap: round"></path>
<path ref="{{near1_2Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.36; stroke-width: 4; stroke-linecap: round"></path>
<path ref="{{near1_3Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.36; stroke-width: 4; stroke-linecap: round"></path>
<path ref="{{near1_4Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.36; stroke-width: 4; stroke-linecap: round"></path>
<path ref="{{near2_0Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.44; stroke-width: 5.2; stroke-linecap: round"></path>
<path ref="{{near2_1Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.44; stroke-width: 5.2; stroke-linecap: round"></path>
<path ref="{{near2_2Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.44; stroke-width: 5.2; stroke-linecap: round"></path>
<path ref="{{near2_3Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.44; stroke-width: 5.2; stroke-linecap: round"></path>
<path ref="{{near2_4Ref}}" d="M 0 0" style="fill: none; stroke: #CFEAF3; stroke-opacity: 0.44; stroke-width: 5.2; stroke-linecap: round"></path>
</g>
<g ref="{{floorRef}}">
<path d="M -20 652 C 60 630 120 648 200 638 C 280 628 330 650 410 636 L 410 1500 L -20 1500 Z" style="fill: #0A1A20"></path>
<path d="M -20 652 C 60 630 120 648 200 638 C 280 628 330 650 410 636" style="fill: none; stroke: #23434A; stroke-width: 2; opacity: 0.7"></path>
<ellipse cx="62" cy="650" rx="26" ry="11" style="fill: #102A30"></ellipse>
<ellipse cx="318" cy="646" rx="34" ry="13" style="fill: #0E252B"></ellipse>
<ellipse cx="190" cy="660" rx="18" ry="7" style="fill: #12303A"></ellipse>
</g>
<path ref="{{weedB0Ref}}" d="M 0 0" style="fill: #0B2A22"></path>
<path ref="{{weedB1Ref}}" d="M 0 0" style="fill: #0E3328"></path>
</g>
<g ref="{{hSwayRef}}" style="display: none">
<g ref="{{hBodyRef}}">
<svg x="245" y="285" width="120" height="190" viewBox="0 0 240 380" style="overflow: visible">
<ellipse ref="{{hHaloRef}}" cx="120" cy="125" rx="90" ry="80" filter="url(#sw-halo)" style="fill: #C9A7F0; opacity: 0.2"></ellipse>
<path ref="{{hTentRef}}" d="M 0 0" style="fill: none; stroke: #C9A7F0; stroke-opacity: 0.55; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"></path>
<path ref="{{hBellRef}}" d="M 0 0" style="fill: url(#sw-hbellfill); stroke: #C9A7F0; stroke-width: 3; stroke-linejoin: round"></path>
<path ref="{{hInnerRef}}" d="M 0 0" style="fill: #FFFFFF; opacity: 0.12"></path>
<ellipse ref="{{hGlossRef}}" cx="90" cy="100" rx="20" ry="10" style="fill: #FFFFFF; opacity: 0.2"></ellipse>
</svg>
</g>
</g>
<g ref="{{gSwayRef}}">
<g ref="{{gBodyRef}}">
<svg x="245" y="285" width="120" height="190" viewBox="0 0 240 380" style="overflow: visible">
<ellipse ref="{{gHaloRef}}" cx="120" cy="125" rx="90" ry="80" filter="url(#sw-halo)" style="fill: #B9A7F0; opacity: 0.2"></ellipse>
<path ref="{{gTentRef}}" d="M 0 0" style="fill: none; stroke: #B9A7F0; stroke-opacity: 0.55; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"></path>
<path ref="{{gBellRef}}" d="M 0 0" style="fill: url(#sw-gbellfill); stroke: #B9A7F0; stroke-width: 3; stroke-linejoin: round"></path>
<path ref="{{gInnerRef}}" d="M 0 0" style="fill: #FFFFFF; opacity: 0.12"></path>
<ellipse ref="{{gGlossRef}}" cx="90" cy="100" rx="20" ry="10" style="fill: #FFFFFF; opacity: 0.2"></ellipse>
</svg>
</g>
</g>
<g ref="{{swayRef}}">
<g ref="{{bodyRef}}">
<svg x="135" y="285" width="120" height="190" viewBox="0 0 240 380" style="overflow: visible">
<ellipse ref="{{haloRef}}" cx="120" cy="125" rx="90" ry="80" filter="url(#sw-halo)" style="fill: {{bodyColor}}; opacity: 0.1"></ellipse>
<path ref="{{tentRef}}" d="M 0 0" style="fill: none; stroke: {{bodyColor}}; stroke-opacity: 0.55; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"></path>
<path ref="{{bellRef}}" d="M 0 0" style="fill: url(#sw-bellfill); stroke: {{bodyColor}}; stroke-width: 3; stroke-linejoin: round"></path>
<path ref="{{innerRef}}" d="M 0 0" style="fill: #FFFFFF; opacity: 0.12"></path>
<ellipse ref="{{glossRef}}" cx="90" cy="100" rx="20" ry="10" style="fill: #FFFFFF; opacity: 0.2"></ellipse>
</svg>
</g>
</g>
<g clip-path="url(#sw-wclip)">
<path ref="{{weedF0Ref}}" d="M 0 0" style="fill: #0F3529"></path>
<path ref="{{weedF1Ref}}" d="M 0 0" style="fill: #123F31"></path>
<path ref="{{weedF2Ref}}" d="M 0 0" style="fill: #17503D"></path>
<g ref="{{fishL3LayerRef}}">
<g ref="{{fishL3_0Ref}}" style="display: none; fill: #050E16" filter="url(#sw-dof1)"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL3_0Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
</g>
<g ref="{{fishL4LayerRef}}">
<g ref="{{fishL4_0Ref}}" style="display: none; fill: #010407" filter="url(#sw-dof2)"><path d="M -10 0 Q -1 -6.5 11 0 Q -1 6.5 -10 0 Z"></path><path ref="{{tailL4_0Ref}}" d="M -8.5 0 L -17 -6 L -15 0 L -17 6 Z"></path></g>
</g>
<rect ref="{{veilRef}}" x="-10" y="0" width="410" height="3000" style="fill: #0B4A6A; opacity: 0"></rect>
</g>
<path ref="{{surfaceRef}}" d="M 0 0" style="fill: none; stroke: #E8F7FF; stroke-width: 1.6; stroke-linecap: round; opacity: 0.8"></path>
</svg>
<div style="position: absolute; left: 24px; right: 24px; top: 30px; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 14px; background: rgba(6,16,27,0.55); border: 1px solid rgba(232,241,242,0.12)">
<div data-dev style="display: flex; justify-content: space-between; align-items: baseline">
<label for="sw-guide" style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #B7C7D1">Guide 1 rhythm</label>
<div style="font-size: 12px; color: #E8F1F2">{{guideLabel}}</div>
</div>
<input data-dev id="sw-guide" type="range" min="3" max="14" step="0.5" value="{{bpm}}" onChange="{{onGuide}}" style="width: 100%; height: 28px; margin: 0; accent-color: {{bodyColor}}">
<div data-dev style="display: flex; justify-content: space-between; font-size: 11px; color: #9FB3BF">
<span>Slower</span>
<span>Faster</span>
</div>
<div data-dev style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px">
<label for="sw-guide2" style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #B7C7D1">Guide 2 rhythm (pair)</label>
<div style="font-size: 12px; color: #E8F1F2">{{guide2Label}}</div>
</div>
<input data-dev id="sw-guide2" type="range" min="3" max="14" step="0.5" value="{{bpm2}}" onChange="{{onGuide2}}" style="width: 100%; height: 28px; margin: 0; accent-color: {{bodyColor}}">
<div style="display: flex; flex-wrap: wrap; column-gap: 18px; margin-top: 2px; font-size: 12px; color: #E8F1F2">
<label data-dev style="display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer"><input type="checkbox" checked="{{fishBgOn}}" onChange="{{onFishBg}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{bodyColor}}">Background fish</label>
<label data-dev style="display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer"><input type="checkbox" checked="{{fishFgOn}}" onChange="{{onFishFg}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{bodyColor}}">Foreground fish</label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer"><input type="checkbox" checked="{{soundOn}}" onChange="{{onSound}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{bodyColor}}">Sound (headphones)</label>
<label style="display: flex; align-items: center; gap: 8px; min-height: 28px; cursor: pointer"><input type="checkbox" checked="{{micOn}}" onChange="{{onMic}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{bodyColor}}">Microphone</label>
</div>
<div ref="{{micRowRef}}" style="display: none; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #B7C7D1; width: 38px">Mic</div>
<div style="position: relative; flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(232,241,242,0.12); overflow: hidden">
<div ref="{{micLvlRef}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: #E8F1F2; transform-origin: left center; transform: scaleX(0)"></div>
<div ref="{{micThrRef}}" style="position: absolute; top: 0; left: 27%; width: 2px; height: 6px; background: #F4A259"></div>
</div>
</div>
<div ref="{{micStatusRef}}" style="font-size: 11px; line-height: 1.4; color: #E8F1F2">Listening</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 4px">
<div data-dev ref="{{depthRef}}" style="font-size: 11px; color: #E8F1F2; width: 64px; white-space: nowrap">0 px</div>
<div data-dev style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #B7C7D1; width: 38px">Sync</div>
<div data-dev style="flex-grow: 1; height: 6px; border-radius: 3px; background: rgba(232,241,242,0.12); overflow: hidden">
<div ref="{{syncRef}}" style="width: 100%; height: 6px; border-radius: 3px; background: {{bodyColor}}; transform-origin: left center; transform: scaleX(0.02)"></div>
</div>
<button type="button" onClick="{{onRestart}}" style="margin-left: auto; min-height: 28px; padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(232,241,242,0.25); background: transparent; color: #E8F1F2; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer">Restart</button>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 36px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div ref="{{guideCueRef}}" style="display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="position: relative; width: 220px; height: 28px">
<div ref="{{cueInRef}}" style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #E8F1F2; opacity: 0">Breathe in</div>
<div ref="{{cueOutRef}}" style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #E8F1F2; opacity: 0">Breathe out</div>
<div ref="{{cueRestRef}}" style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #B7C7D1; opacity: 0">Glide</div>
<div ref="{{cueStartRef}}" style="position: absolute; inset: -4px -40px; display: flex; justify-content: center; align-items: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #E8F1F2; opacity: 0">Breathe out to rise</div>
<div ref="{{cueEndRef}}" style="position: absolute; inset: -4px -40px; display: flex; justify-content: center; align-items: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #FFFFFF; opacity: 0">You reached the surface</div>
</div>
<div style="width: 180px; height: 4px; border-radius: 2px; background: rgba(232,241,242,0.12); overflow: hidden">
<div ref="{{swellRef}}" style="width: 180px; height: 4px; border-radius: 2px; background: {{bodyColor}}; transform-origin: center; transform: scaleX(0.12)"></div>

      onSound: function (ev) { self.setSound(ev.target.checked); },
      micOn: !!st.mic,
      onMic: function (ev) { self.setMic(ev.target.checked); },
      onRestart: function () { self.restart(); },
      onBreathStart: function (ev) { if (ev && ev.preventDefault) ev.preventDefault(); self.breathStart(); },
      onBreathEnd: function () { self.breathEnd(); },
      onKeyStart: function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); if (!ev.repeat) self.breathStart(); } },
      onKeyEnd: function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); self.breathEnd(); } },
      buttonText: st.pressed ? 'Exhaling' : 'Hold to exhale',
      buttonFill: st.pressed ? 'rgba(143,211,232,0.32)' : 'rgba(232,241,242,0.06)',
      buttonRing: st.pressed ? bodyColor : 'rgba(232,241,242,0.3)',
      readout1: st.readout1 || 'Hold the button while you breathe out',
      readout2: st.readout2 || 'Breathe out with the cue to build sync'
    });
  }
}

</script>
</body>
</html>
