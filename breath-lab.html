<!doctype html>

<style>
html,body{margin:0;height:100%;background:#02060B;overflow:hidden}

<body>
<div id="stage"><div id="phone"></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #06101B; color: #E8F1F2; font-family: 'IBM Plex Mono', ui-monospace, monospace; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation">
<svg viewBox="0 0 390 560" style="position: absolute; left: 0; top: 0; width: 390px; height: 560px" aria-hidden="true">
<defs>

</svg>

<button type="button" aria-label="Hold while you breathe out and through the glide; release to breathe in" onPointerDown="{{onPress}}" onPointerUp="{{onRelease}}" onPointerCancel="{{onRelease}}" onContextMenu="{{onNoMenu}}" onKeyDown="{{onKeyDown}}" onKeyUp="{{onKeyUp}}" style="width: 104px; height: 104px; border-radius: 52px; border: 2px solid {{btnRing}}; background: {{btnFill}}; color: #E8F1F2; font-family: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.35; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none">{{btnText}}</button>

</template>
<script>
const PROPS = {"micThreshold": 8, "calBreaths": 4, "bodyColor": "#8FD3E8"};

// ---- minimal runtime: mounts the template, wires bindings, events and refs (stands in for the design-tool runtime) ----
class DCLogic {
  constructor(props) { this.props = props; this.state = null; }
  setState(patch) { this.state = Object.assign({}, this.state, patch); scheduleUpdate(); }
  forceUpdate() { scheduleUpdate(); }
}
const HOLE = /\{\{\s*([\w.]+)\s*\}\}/g;
const ONLY = /^\{\{\s*([\w.]+)\s*\}\}$/;
const bindings = [];
let comp, vals, pending = false;
function get(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), vals); }
function fill(t) { return t.replace(HOLE, (_, p) => { const v = get(p); return v == null ? '' : String(v); }); }
function apply() {
  for (const b of bindings) {
    if (b.kind === 'attr') b.el.setAttribute(b.name, fill(b.tmpl));
    else if (b.kind === 'checked') b.el.checked = !!get(b.key);
    else if (b.kind === 'value') { const v = get(b.key); if (document.activeElement !== b.el) b.el.value = v; }
    else if (b.kind === 'text') b.node.nodeValue = fill(b.tmpl);
  }
}
function scheduleUpdate() {
  if (pending) return; pending = true;
  requestAnimationFrame(() => { pending = false; vals = comp.renderVals(); apply(); });
}
function mount(host, html, Ctor, props) {
  comp = new Ctor(props);
  vals = comp.renderVals();
  host.innerHTML = html;
  host.querySelectorAll('*').forEach(el => {
    for (const at of Array.from(el.attributes)) {
      if (at.value.indexOf('{{') < 0) continue;
      const only = at.value.match(ONLY), name = at.name;
      if (name === 'ref' && only) { el.removeAttribute(name); vals[only[1]](el); }
      else if (name.startsWith('on') && only) {
        el.removeAttribute(name);
        let evt = name.slice(2).toLowerCase();
        if (evt === 'change' && el.type === 'range') evt = 'input';
        const key = only[1];
        el.addEventListener(evt, ev => { const f = get(key); if (f) f(ev); });
      }
      else if (name === 'checked' && only) { el.removeAttribute(name); bindings.push({ kind: 'checked', el, key: only[1] }); }
      else if (name === 'value' && only && el.tagName === 'INPUT') { el.removeAttribute(name); bindings.push({ kind: 'value', el, key: only[1] }); }
      else bindings.push({ kind: 'attr', el, name, tmpl: at.value });
    }
  });
  const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
  let n; while ((n = walker.nextNode())) if (n.nodeValue.indexOf('{{') >= 0) bindings.push({ kind: 'text', node: n, tmpl: n.nodeValue });
  apply();
  if (comp.componentDidMount) comp.componentDidMount();
}
// fit the 390 x 844 phone frame to the window
function fit() {
  const k = Math.min(window.innerWidth / 390, window.innerHeight / 844, 1.25);
  document.getElementById('phone').style.transform = 'scale(' + k + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('DOMContentLoaded', () => {
  mount(document.getElementById('phone'), document.getElementById('tpl').innerHTML, Component, PROPS);
  fit();
});




// Breath lab: the jellyfish and the breath identification from Swell, with nothing else. No cues: just whether a
// breath reliably registers and drives the jellyfish. The button: press = breathe out, hold through the glide,
// release = breathe in.
class Component extends DCLogic {
  ref(name) {
    this._refs = this._refs || {}; this._els = this._els || {};
    var self = this;
    if (!this._refs[name]) this._refs[name] = function (el) { self._els[name] = el; };
    return this._refs[name];
  }
  init() {
    if (this.sim) return;
    this.sim = {
      c: 0, v: 0, dist: 0, wave: 0, guide: 0, now: 0, phase: 'start', t0: null,
      holding: false, kicks: 0, queue: [], curLeft: 0, ph: 0, resting: true, inPow: false,
      rate: null, steady: 0, steadyShown: 0, presses: [], hist: []
    };
  }
  componentDidMount() {
    this.init();
    var self = this;
    var loop = function (ms) { self._raf = requestAnimationFrame(loop); self.tick(ms / 1000); };
    this._raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); this.stopMic(); }
  recalibrate() {
    this.sim = null; this.init();
    var m = this.mic;
    if (m) { m.mode = 'calibrating'; m.events = []; m.log = []; m.lastEndT = null; m.lastLabel = null; m.prof = null; m.guard = null; m.warn = null; m.anchorIn = null; m.exPeakMin = null; }
  }

  // ---------- microphone ----------
  setMic(on) {
    var self = this;
    if (!on) { this.stopMic(); this.micErr = null; this.setState({ mic: false }); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { this.micErr = 'No microphone available here'; this.setState({ mic: false }); return; }
    this.micErr = 'Asking for the microphone';
    this.setState({ mic: true });
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (stream) {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC(), src = ctx.createMediaStreamSource(stream), hp = ctx.createBiquadFilter(), an = ctx.createAnalyser();
      hp.type = 'highpass'; hp.frequency.value = 100; an.fftSize = 1024; an.smoothingTimeConstant = 0;
      src.connect(hp); hp.connect(an); ctx.resume();
      var track = stream.getAudioTracks()[0], set = track && track.getSettings ? track.getSettings() : {};
      var inLat = typeof set.latency === 'number' ? set.latency : null;
      var frame = an.fftSize / ctx.sampleRate;
      var lag = (inLat == null ? 0.02 : inLat) + frame / 2 + 0.06;      // device input + half an analysis window + onset hold
      self.mic = { ctx: ctx, stream: stream, an: an, buf: new Float32Array(an.frequencyBinCount), sr: ctx.sampleRate,
        floor: null, eS: -140, rel: 0, ev: null, above: 0, below: 0, lag: lag, inLat: inLat,
        mode: 'calibrating', events: [], log: [], lastLabel: null, lastEndT: null, prof: null, guard: null, warn: null };
      self.sim = null; self.init();
      self.micErr = null;
    }).catch(function (err) { self.micErr = 'Microphone unavailable (' + ((err && err.name) || 'error') + ')'; self.setState({ mic: false }); });
  }
  stopMic() {
    var m = this.mic; if (!m) return;
    m.stream.getTracks().forEach(function (tr) { tr.stop(); }); m.ctx.close(); this.mic = null;
  }
  micOnThreshold() {
    var base = this.props.micThreshold ?? 8, m = this.mic;
    return m && m.mode === 'exhale' && m.guard != null ? Math.max(base, m.guard) : base;
  }
  micFrame(t, dt) {
    var m = this.mic; if (!m) return;
    m.an.getFloatFrequencyData(m.buf);
    var binHz = m.sr / m.an.fftSize, pw = 0, pc = 0;
    var lo = Math.floor(150 / binHz), hi = Math.min(m.buf.length - 1, Math.ceil(4000 / binHz));
    for (var i = lo; i <= hi; i++) { var q = Math.pow(10, m.buf[i] / 10); pw += q; pc += q * i * binHz; }
    var e = 10 * Math.log10(pw + 1e-14), cen = pw > 0 ? pc / pw : 0;
    m.cen = cen;
    if (m.warm == null) { m.warm = 0; m.eS = e; }
    m.eS += (e - m.eS) * (1 - Math.exp(-dt / (e > m.eS ? 0.03 : 0.09)));       // fast attack, slower release
    if (m.warm < 1) { m.warm += dt; m.floor = m.floor == null ? m.eS : Math.min(m.floor + (m.eS - m.floor) * 0.2, m.eS); m.rel = 0; return; }   // learn the room for a second first
    if (!m.ev) m.floor += (m.eS - m.floor) * (1 - Math.exp(-dt / (m.eS < m.floor ? 0.3 : 6)));   // the floor sinks quickly, rises slowly
    var rel = m.eS - m.floor; m.rel = rel;
    var onT = this.micOnThreshold(), offT = Math.max(2.5, onT * 0.45);
    if (!m.ev) {
      m.above = rel > onT ? m.above + dt : 0;
      if (m.above >= 0.06) { m.ev = { t0: t - m.lag, levels: [], cens: [], peak: rel, dur: 0, decided: false }; m.below = 0; }
    } else {
      var ev = m.ev; ev.dur = t - ev.t0; ev.peak = Math.max(ev.peak, rel);
      if (ev.levels.length < 7) { ev.levels.push(rel); ev.cens.push(cen); }
      if (!ev.decided && ev.levels.length >= 7) this.micDecide(ev);
      m.below = rel < offT ? m.below + dt : 0;
      if (m.below >= 0.15) this.micEnd(ev);
      else if (ev.dur > 8) { this.micEnd(ev); m.floor = m.eS; }    // nothing breathes for 8 s: the room got louder, re-learn the floor
    }
  }
  micFeat(ev) {
    var a = 0, c = 0; for (var i = 0; i < ev.levels.length; i++) { a += ev.levels[i]; c += ev.cens[i]; }
    return [a / ev.levels.length, Math.log2(Math.max(60, c / ev.levels.length))];
  }
  micClassify(f, cue) {
    var m = this.mic, P = m.prof, best = null, bs = -1e9;
    ['ex', 'in'].forEach(function (k) {
      var sc = 0;
      for (var j = 0; j < 2; j++) { var z = (f[j] - P[k].mu[j]) / P[k].sd[j]; sc -= 0.5 * z * z + Math.log(P[k].sd[j]); }
      sc += Math.log(m.lastLabel == null ? 0.5 : (m.lastLabel === k ? 0.25 : 0.75));   // breaths alternate
      if (cue) sc += Math.log(cue === k ? 0.8 : 0.2);                                   // the cue showing when it began
      if (sc > bs) { bs = sc; best = k; }
    });
    return best;
  }
  // no cues in this lab: nothing on screen to label a sound by, so these always say nothing
  cuePhaseAt() { return null; }
  micCueAt() { return null; }
  micCueCore() { return null; }
  // A breath often reaches the mic in pieces. A sound that starts within 0.5 s of the previous one ending continues
  // that breath (same label, not a new breath), unless it starts under the other breath's cue.
  micCont(ev) {
    var m = this.mic, s = this.sim;
    if (m.lastEndT == null || !m.lastLabel || !s || s.phase === 'start' || ev.t0 - m.lastEndT > 0.5) return false;
    var cueNow = m.mode === 'calibrating' ? this.micCueAt(ev.t0) : this.micCueCore(ev.t0);
    if (cueNow && cueNow !== m.lastLabel) return false;
    ev.cont = true; ev.decided = true; ev.label = m.lastLabel; ev.live = m.lastLabel; ev.cue = null; ev.core = null;
    if (ev.label === 'in') s.inhaling = true;
    return true;
  }
  micDecide(ev) {
    var m = this.mic; ev.decided = true; ev.f = this.micFeat(ev);
    if (this.micCont(ev)) return;
    var label;
    if (m.mode === 'both') { ev.cue = this.micCueAt(ev.t0); label = this.micClassify(ev.f, ev.cue); }
    else if (m.mode === 'exhale') {
      // exhales only: anything far quieter or far brighter than your exhales is a stray inhale or room noise
      var P = m.prof.ex;
      var stray = ev.f[0] < P.mu[0] - 3 * P.sd[0] || ev.f[1] > P.mu[1] + 3 * P.sd[1];
      label = stray ? 'x' : 'ex';
      if (stray) { var cap = m.exPeakMin != null ? m.exPeakMin - 2 : Infinity; m.guard = Math.min(cap, Math.max(m.guard || 0, ev.peak + 2)); }
    }
    else {
      // calibrating: the session opens on "Breathe in" and waits for a sound. That first sound is an inhale.
      var sS = this.sim;
      if (sS && sS.phase === 'start') {
        sS.phase = 'swim'; sS.t0 = ev.t0;
        m.anchorIn = ev.f.slice(); ev.cue = 'in'; label = 'in';
      }
      else if ((ev.core = this.micCueCore(ev.t0))) { label = ev.core; ev.cue = ev.core; }   // clearly inside a cue: the cue labels it
      else if ((ev.cue = this.micCueAt(ev.t0))) label = ev.cue;                              // the cue on screen labels it
      else {
        // no cue to go on: judge by sound against the exhales heard so far, and keep breaths alternating
        var exs = m.events.filter(function (x) { return x.label === 'ex'; }).map(function (x) { return x.f; });
        if (!exs.length) label = m.lastLabel === 'in' ? 'ex' : 'in';
        else {
          var r0 = 0, r1 = 0; exs.forEach(function (x) { r0 += x[0]; r1 += x[1]; }); r0 /= exs.length; r1 /= exs.length;
          label = (m.lastLabel !== 'in' && ev.f[0] < r0 - 4 && ev.f[1] > r1 + 0.25) ? 'in' : 'ex';
        }
      }
    }
    ev.label = label; ev.live = label;
    if (label === 'ex') this.breathStart(ev.t0); else if (label === 'in') this.inhaleStart(ev.t0);
  }
  micEnd(ev) {
    var m = this.mic; m.ev = null;
    if (!ev.decided && !ev.cont) { ev.f = this.micFeat(ev); this.micCont(ev); }
    var rec;
    if (ev.cont) {
      if (ev.label === 'in') this.inhaleEnd();
      var lastE = m.events[m.events.length - 1];
      if (lastE) lastE.dur = Math.max(lastE.dur, ev.t0 + ev.dur - lastE.t0);
      m.lastEndT = performance.now() / 1000;
      rec = { t0: ev.t0, dur: ev.dur, f: ev.f, peak: ev.peak, label: ev.label, live: ev.label, cue: null, core: null, cont: true, mode: m.mode, parent: lastE || null };
      m.log.push(rec); if (m.log.length > 200) m.log.shift();
      return;
    }
    if (!ev.decided) { ev.f = this.micFeat(ev); ev.label = m.mode === 'both' && m.prof ? this.micClassify(ev.f, this.micCueAt(ev.t0)) : 'ex'; ev.live = ev.label; ev.decided = true; if (ev.label === 'ex') this.breathStart(ev.t0); else this.inhaleStart(ev.t0); }
    if (ev.label === 'ex') this.breathEnd(); else if (ev.label === 'in') this.inhaleEnd();
    if (ev.label === 'x' && m.guard != null) m.guard = Math.min(m.exPeakMin != null ? m.exPeakMin - 2 : Infinity, Math.max(m.guard, ev.peak + 2));
    if (ev.label !== 'x') { m.lastLabel = ev.label; m.lastEndT = performance.now() / 1000; }
    rec = { t0: ev.t0, f: ev.f, peak: ev.peak, dur: ev.dur, label: ev.label, live: ev.live || ev.label, cue: ev.cue || null, core: ev.core || null, mode: m.mode, short: ev.dur < 0.25 };
    if (!rec.short) { m.events.push(rec); if (m.events.length > 60) m.events.shift(); }
    m.log.push(rec); if (m.log.length > 200) m.log.shift();
  }
  micFinalize() {
    var m = this.mic, evs = m.events.slice();
    // Re-sort everything heard so far into two groups by its features (2-means on level and centroid)
    if (evs.length >= 3) {
      var cA = evs.reduce(function (p, x) { return x.f[0] > p.f[0] ? x : p; }).f.slice();
      var cB = evs.reduce(function (p, x) { return x.f[0] < p.f[0] ? x : p; }).f.slice();
      var asg = [];
      for (var it = 0; it < 8; it++) {
        asg = evs.map(function (x) {
          var dA = Math.pow((x.f[0] - cA[0]) / 4, 2) + Math.pow((x.f[1] - cA[1]) / 0.3, 2);
          var dB = Math.pow((x.f[0] - cB[0]) / 4, 2) + Math.pow((x.f[1] - cB[1]) / 0.3, 2);
          return dA <= dB ? 'A' : 'B';
        });
        [['A', cA], ['B', cB]].forEach(function (pair) {
          var mem = evs.filter(function (x, k) { return asg[k] === pair[0]; });
          if (mem.length) { pair[1][0] = mem.reduce(function (p, x) { return p + x.f[0]; }, 0) / mem.length; pair[1][1] = mem.reduce(function (p, x) { return p + x.f[1]; }, 0) / mem.length; }
        });
      }
      var sepd = Math.abs(cA[0] - cB[0]) / 4 + Math.abs(cA[1] - cB[1]) / 0.3;
      var hasB = asg.indexOf('B') >= 0;
      // the quieter group is the inhales, unless the sounds made clearly inside a cue mostly say the opposite
      var inGroup = 'B', nCore = 0, agreeB = 0;
      evs.forEach(function (x, k) { if (x.core) { nCore++; if ((asg[k] === 'B' ? 'in' : 'ex') === x.core) agreeB++; } });
      if (hasB && nCore >= 4 && agreeB / nCore <= 0.35) inGroup = 'A';
      evs.forEach(function (x, k) { x.label = !hasB || sepd < 2 ? 'ex' : asg[k] === inGroup ? 'in' : 'ex'; });
      // a sound made clearly inside a cue keeps that cue's label unless it sounds unmistakably like the other kind
      if (hasB && sepd >= 2) evs.forEach(function (x) {

    el.swayRef.setAttribute('transform', 'translate(' + (A * Math.sin(wph)).toFixed(1) + ' 0) rotate(' + (Tr * Math.cos(wph)).toFixed(2) + ' 195 230)');
    el.bodyRef.setAttribute('transform', 'translate(0 ' + this.bodyDip(s, vTop).toFixed(1) + ')');

    // what is being heard right now (mic), or what the button says
    var heard = m && m.ev ? (m.ev.decided ? m.ev.label : '?') : this.btnDown ? 'ex' : null;
    if (!heard && !m && s.inhaling) heard = 'in';
    var COL = { in: '#B9A7F0', ex: '#8FD3E8', x: '#6B7C88', '?': '#E8F1F2' };
    el.haloRef.style.fill = heard ? COL[heard] : (this.props.bodyColor ?? '#8FD3E8');
    el.haloRef.style.opacity = heard ? '0.55' : '0.15';
    var hTxt = heard === 'in' ? 'inhale' : heard === 'ex' ? 'exhale' : heard === 'x' ? 'ignored sound' : heard === '?' ? 'a sound…' : 'nothing';
    if (el.heardRef.textContent !== hTxt) { el.heardRef.textContent = hTxt; el.heardRef.style.color = heard ? COL[heard] : '#9FB3BF'; }
    var sp = s.ph, sTxt = s.phase === 'start' ? 'waiting' : s.resting ? 'resting' : s.relaxing ? 'settling' : sp < 0.33 ? 'opening (inhale)' : sp < 0.4 ? 'open, holding' : sp < 0.5 ? 'push' : sp < 0.65 ? 'easing' : 'glide';
    if (el.stateRef.textContent !== sTxt) el.stateRef.textContent = sTxt;
    var pr = s.phase !== 'start' ? '' : m ? (m.warm >= 1 ? 'Breathe in' : 'Listening to the room…') : (this.micErr || 'Hold to breathe out');
    el.promptRef.style.opacity = pr ? '1' : '0';
    if (pr && el.promptRef.textContent !== pr) el.promptRef.textContent = pr;

    // mic level against the threshold
    var onT = this.micOnThreshold();
    el.lvlRef.style.transform = 'scaleX(' + (m ? Math.max(0, Math.min(1, m.rel / 50)) : 0).toFixed(3) + ')';
    el.lvlRef.style.background = heard && m ? COL[heard] : '#E8F1F2';
    el.thrRef.style.left = (Math.min(1, onT / 50) * 100).toFixed(1) + '%';
    var stt = this.labStatus();
    if (el.statusRef.textContent !== stt) el.statusRef.textContent = stt;
  }
  labStatus() {
    var m = this.mic; if (!m) return this.micErr || 'Microphone off · use the button';
    if (m.warm == null || m.warm < 1) return 'Listening to the room…';
    var calN = this.props.calBreaths ?? 4;
    if (m.mode === 'calibrating') {
      var ne = m.events.filter(function (x) { return x.label === 'ex'; }).length, ni = m.events.filter(function (x) { return x.label === 'in'; }).length;
      return 'Calibrating · exhales ' + ne + ' / ' + calN + ' · inhales ' + ni;
    }
    if (m.mode === 'both') return 'Calibrated · hearing inhales and exhales';
    return 'Calibrated · hearing exhales only' + (m.warn ? ' (' + m.warn + ')' : '');
  }

  renderVals() {
    this.init();
    var self = this, st = this.state || {};
    var bodyColor = this.props.bodyColor ?? '#8FD3E8';
    var vals = {};
    ['swayRef', 'bodyRef', 'haloRef', 'tentRef', 'bellRef', 'innerRef', 'glossRef', 'promptRef', 'heardRef', 'stateRef',
      'statusRef', 'lvlRef', 'thrRef'].forEach(function (nm) { vals[nm] = self.ref(nm); });
    return Object.assign(vals, {
      bodyColor: bodyColor,
      micLabel: st.mic ? 'Mic on' : 'Mic off',
      micBtnRing: st.mic ? bodyColor : 'rgba(232,241,242,0.25)',
      micBtnFill: st.mic ? 'rgba(143,211,232,0.18)' : 'transparent',
      onMicToggle: function () { self.setMic(!st.mic); },
      onRecalibrate: function () { self.btnDown = false; self.recalibrate(); self.setState({ pressed: false }); },
      onPress: function (ev) { if (ev && ev.preventDefault) ev.preventDefault(); if (ev && ev.target && ev.target.setPointerCapture && ev.pointerId != null) { try { ev.target.setPointerCapture(ev.pointerId); } catch (e2) {} } self.btnPress(); },
      onRelease: function () { self.btnRelease(); },
      onNoMenu: function (ev) { if (ev && ev.preventDefault) ev.preventDefault(); },
      onKeyDown: function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); if (!ev.repeat) self.btnPress(); } },
      onKeyUp: function (ev) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); self.btnRelease(); } },
      btnText: st.pressed ? 'Breathing out' : 'Hold to breathe out',
      btnFill: st.pressed ? 'rgba(143,211,232,0.32)' : 'rgba(232,241,242,0.06)',
      btnRing: st.pressed ? bodyColor : 'rgba(232,241,242,0.3)'
    });
  }
}

</script>
